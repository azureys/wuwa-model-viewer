# Publishes web/ as the iPhone / browser version (PWA) on GitHub Pages.
name: Publish PWA
on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/gen-sw.mjs', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  # Build and deploy are separate jobs (GitHub's recommended layout): the artifact is fully
  # registered when the build job ends, so deploy-pages no longer races it ("No artifacts named
  # github-pages were found", seen on two merges).
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node tools/gen-sw.mjs web
      - run: touch web/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
