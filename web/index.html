<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>WuWa Viewer</title>
<meta name="theme-color" content="#0e1016">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="WuWa Viewer">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="stylesheet" href="styles.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
</head>
<body>
<div id="app">
  <canvas id="view"></canvas>

  <header id="topbar">
    <button class="icon" id="btnLibrary" title="Library">☰</button>
    <div id="title">3D Viewer</div>
    <button class="icon" id="btnResetView" title="Reset camera">⟲</button>
    <button class="icon" id="btnShot" title="Screenshot">📷</button>
    <button class="icon" id="btnHideUi" title="Hide interface">👁</button>
  </header>

  <div id="status" hidden><div class="spinner"></div><span id="statusText"></span></div>
  <div id="toast" hidden></div>
  <div id="pickHint" hidden></div>

  <div id="player" hidden>
    <button class="icon" id="btnPlay">⏸</button>
    <input type="range" id="timeline" min="0" max="1000" value="0" step="1">
    <span id="frameLabel">0/0</span>
    <button class="chip small" id="btnLoop" aria-pressed="true">🔁</button>
    <select id="speed">
      <option value="0.1">0.1×</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option>
      <option value="1" selected>1×</option><option value="1.5">1.5×</option><option value="2">2×</option>
    </select>
  </div>

  <section id="sheet" hidden>
    <div class="sheet-grip" id="grip"><div class="sz"><button data-sz="peek" title="Low">▁</button><button data-sz="half" title="Medium">▄</button><button data-sz="full" title="Tall">█</button></div></div>
    <div id="sheetBody"></div>
  </section>

  <nav id="tabs">
    <button data-tab="anim"><span>🎬</span>Animation</button>
    <button data-tab="pose"><span>🦴</span>Pose</button>
    <button data-tab="parts"><span>👗</span>Clothes</button>
    <button data-tab="equip"><span>⚔️</span>Gear</button>
    <button data-tab="face"><span>🙂</span>Face</button>
    <button data-tab="lights"><span>💡</span>Lights</button>
    <button data-tab="scene"><span>🖼️</span>Scene</button>
    <button data-tab="look"><span>🎨</span>Look</button>
  </nav>

  <div id="library" hidden>
    <div class="lib-head">
      <h1>Library</h1>
      <button class="icon" id="btnCloseLibrary">✕</button>
    </div>
    <p class="hint" id="libHint">Pick a character to download it from encore.moe, or import a <b>.zip</b> from its 3D viewer (“Download .zip”). Everything is stored on your phone and works offline.</p>
    <button class="primary" id="btnStore">⬇ Download characters</button>
    <button class="btn wide" id="btnImport">＋ Import .zip</button>
    <div id="importProgress" hidden><div class="bar"><div></div></div><span></span></div>
    <ul id="modelList"></ul>
  </div>
</div>
  <div id="store" hidden>
    <div class="lib-head">
      <button class="icon" id="btnStoreBack">←</button>
      <h1 id="storeTitle">encore.moe</h1>
      <button class="icon" id="btnStoreClose">✕</button>
    </div>
    <div id="storeBody"></div>
  </div>
<input type="file" id="filePicker" hidden>
<script type="module" src="src/app.js"></script>
</body>
</html>
